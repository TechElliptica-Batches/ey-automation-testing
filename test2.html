    <div id="host-element"></div>
    <script>
        // Select host element
        const host = document.getElementById("host-element");

        // Attach shadow root
        const shadowRoot = host.attachShadow({ mode: "open" });

        // Add content inside shadow DOM
        shadowRoot.innerHTML = `
            <style>
                p {
                    color: red;
                    font-size: 20px;
                }
            </style>
            <label>Inside Shadow dom</label>
            <input type="text" id="insideshadowinput" />
        `;
    </script>
